services:
  mb-tracker:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    image: mb-tracker:latest
    restart: unless-stopped
    ports:
      - "9464:9464"
    environment:
      MERCEDES_DEVICE_ID: "${MERCEDES_DEVICE_ID:?MERCEDES_DEVICE_ID is required}"
      MERCEDES_EMAIL: "${MERCEDES_EMAIL:?MERCEDES_EMAIL is required}"
      MERCEDES_PASSWORD: "${MERCEDES_PASSWORD:?MERCEDES_PASSWORD must be supplied as a deployment secret}"
